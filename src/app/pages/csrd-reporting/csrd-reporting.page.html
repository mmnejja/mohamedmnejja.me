<section class="hero hero-compact">
  <div class="container">
    <div class="hero-content compact">

      </div>

      <div class="hero-actions compact-actions">
        <a class="btn btn-small" routerLink="/csrd-reporting-simulation">Open Simulation</a>
        <a class="btn btn-outline" href="https://mohamedmnejja.me//csrd-reporting-simulation" target="_blank" rel="noopener">Learn CSRD</a>

      </div>

      <p class="cta-note">One screen. One action. No scrolling needed.</p>
    </div>
  </div>
</section>
