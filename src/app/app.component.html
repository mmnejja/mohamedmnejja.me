<header class="header">
  <nav class="container nav">
    <a class="logo" routerLink="/">Mohamed Mnejja</a>
    
    <button class="menu-toggle" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="nav-links" [class.open]="isMenuOpen">
      <li *ngFor="let link of navLinks" [class.has-submenu]="link.sublinks">
        <a 
          *ngIf="!link.sublinks"
          [routerLink]="link.route" 
          [fragment]="link.fragment || undefined"
          routerLinkActive="active" 
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu()">
          {{ link.label }}
        </a>
        <div *ngIf="link.sublinks" class="dropdown-wrapper">
          <a 
            [routerLink]="link.route"
            [fragment]="link.fragment || undefined"
            class="dropdown-toggle">
            {{ link.label }}
          </a>
          <ul class="dropdown-menu">
            <li *ngFor="let sublink of link.sublinks">
              <a 
                [routerLink]="sublink.route"
                [fragment]="sublink.fragment"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                (click)="closeMenu()">
                {{ sublink.label }}
              </a>
            </li>
          </ul>
        </div>
      </li>
    </ul>
    <app-theme-toggle></app-theme-toggle>
  </nav>
</header>

<main>
  <router-outlet></router-outlet>
</main>
