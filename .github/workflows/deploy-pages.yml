name: Deploy Angular site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npx ng build --configuration production

      - name: Add GitHub Pages SPA fallback
        run: cp dist/mohamedmnejja-portfolio/index.html dist/mohamedmnejja-portfolio/404.html

      - name: Add .nojekyll
        run: touch dist/mohamedmnejja-portfolio/.nojekyll

      - name: Preserve custom domain
        run: cp CNAME dist/mohamedmnejja-portfolio/CNAME

      - name: Publish build to configured Pages source
        run: |
          cp -R dist/mohamedmnejja-portfolio/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 404.html .nojekyll CNAME index.html assets 3rdpartylicenses.txt *.js *.css
          git commit -m "Deploy Angular site [skip ci]" || echo "No generated files changed"
          git push
